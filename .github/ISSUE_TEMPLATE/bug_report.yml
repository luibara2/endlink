name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Almost every problem here turns out to be version-specific, so the
        versions and the log matter more than anything else you can tell me.

        **Found a security problem?** Do not file it here — see
        [SECURITY.md](https://github.com/luibara2/endlink/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        A player ran /send lobby and was disconnected instead of moved.
    validations:
      required: true

  - type: input
    id: client-version
    attributes:
      label: Minecraft client version
      placeholder: "1.26.40"
    validations:
      required: true

  - type: input
    id: backend-version
    attributes:
      label: Backend version
      description: The Minecraft version your Endstone/BDS backends run, and the Endstone version.
      placeholder: "Minecraft 1.26.40, Endstone 0.11.7"
    validations:
      required: true

  - type: input
    id: endlink-version
    attributes:
      label: Endlink version
      description: The release you are running, or the commit if you built it yourself.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: guard
    attributes:
      label: Is EndlinkGuard installed on the backends?
      options:
        - "Yes — stock build"
        - "Yes — modified build"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Proxy log
      description: |
        The relevant part of `logs/latest.log` from around the failure. **Please remove player IP
        addresses and XUIDs** if you would rather not publish them — they appear on join and leave
        lines.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        The relevant part of `config.properties`. **Remove `backendVerification.sharedSecret`** — it
        is the credential your whole network trusts.
      render: properties
    validations:
      required: false
