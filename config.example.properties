# ==============================================================================================
#  Endstone Bedrock proxy — configuration
# ==============================================================================================
#
#  The proxy reads argv[0] as its config path and falls back to ./config.properties beside the
#  jar. If that file does not exist, this template is written there on first start — so the file
#  you are reading is both the documentation and the live configuration.
#
#  SYNTAX, and it bites people:
#    - '#' only starts a comment at the START of a line.
#    - "key=value  # note" keeps "  # note" as PART OF THE VALUE. Always put comments on their
#      own line.
#    - Every key below is shown with its built-in default, so deleting a line is the same as
#      leaving it at the value printed here. Keys shown commented out have no default and are
#      off unless you add them.
#
#  Every setting is listed. If a key is not in this file, the proxy does not read it.
#
# ==============================================================================================


# ==============================================================================================
#  LISTENER — the address players connect to
# ==============================================================================================

# The UDP address the proxy binds. 0.0.0.0 accepts on every interface; set a specific address to
# bind one. This is the port you give to players, not the backend's.
listener.host=0.0.0.0
listener.port=19132

# RakNet is UDP: a full receive buffer drops datagrams and reliable packets then wait for
# retransmission. The listener buffer is shared by every player; each backend connection has its
# own. Linux also caps these requests with net.core.rmem_max/net.core.wmem_max. Endlink reports the
# effective sizes at startup and warns when the OS cap is lower than these values.
network.udp.listenerReceiveBufferBytes=8388608
network.udp.backendReceiveBufferBytes=4194304
network.udp.sendBufferBytes=1048576

# The address players use to reach this proxy, as 'host' or 'host:port'.
#
# Only needed when the proxy has to send a player back to itself. Some backends cannot be joined by
# a seamless handoff — a Geyser instance fronting a Java server numbers block ids differently to a
# Bedrock server, and a client reads that scheme once, at login — so the proxy asks the client to
# reconnect and puts them where they were going. The player never leaves the proxy; they see a
# loading screen.
#
# Left empty the proxy uses whatever address each player themselves connected with, which is correct
# per player and needs no configuration. Set this when that is not good enough: several hostnames
# reach the proxy and only one should be advertised, or players arrive through something that
# rewrites the address they claim.
#   publicAddress=play.example.com
#   publicAddress=play.example.com:19132
publicAddress=


# ==============================================================================================
#  BACKENDS — the servers behind the proxy
# ==============================================================================================

# The default backend, used when nothing else routes the player. 'backend.name' must appear in
# the 'backends' list below.
backend.name=default
backend.host=127.0.0.1
backend.port=19133

# Every backend the proxy knows about, comma-separated. These are the names /server, /send and
# /hub accept, and each one needs a backend.<name>.host and backend.<name>.port below.
#   backends=default,hub,survival
backends=default

# Where /hub sends players, and the default failover target. Must be one of 'backends'.
hubBackend=default

# Address of each named backend. One pair per entry in 'backends'.
backend.default.host=127.0.0.1
backend.default.port=19133

# Which Minecraft version the proxy should speak to backends.
#   auto      - probe the backend with a RakNet unconnected ping and use whatever it reports.
#               Version-agnostic, so it survives a backend upgrade with no config edit. If the
#               probe fails the proxy assumes the client's own version, which is correct
#               whenever client and backend match.
#   <version> - pin it, e.g. 1.26.40, 1.26.30, or a raw protocol number such as 2168 or 1001.
# Prefer 'auto'. A pinned value that is left behind after a backend upgrade makes the proxy speak
# the wrong version, which is a confusing failure rather than an obvious one.
backend.protocol=auto

# Per-backend version override, which WINS over backend.protocol above. Only needed when your
# backends genuinely run different versions — during a rolling upgrade the fleet is always mixed,
# because backends are moved one at a time. A backend on a different version with no override
# gets the wrong protocol and rejects the login as LOGIN_FAILED_CLIENT_OLD.
# Delete these again once the fleet is uniform; a stale override is easy to forget.
#   backend.lobby.protocol=1.26.40
#   backend.default.protocol=1.26.30

# Stop forwarding the client's sub-chunk requests to one backend.
#
# Normally there is no reason to set this: the proxy works it out on its own. A backend that numbers
# block ids by palette order is not a Bedrock server and does not implement the sub-chunk system
# either, and that is learned from the first StartGame it ever sends and remembered. The key is here
# for the one gap that leaves — a backend nobody has visited since the cache was cleared — and as an
# escape hatch if the inference is ever wrong.
#
# It exists for a backend that is not really a Bedrock server — a Geyser instance fronting a
# Minecraft: Java server, say. A client only asks for terrain a sub-chunk at a time because a server
# told it to, and BDS does. That mode belongs to the client's session rather than to one backend, so
# it survives a switch, and the handoff is deliberately seamless — the client is never told the new
# server works differently. The backend then receives requests it never advertised, and Geyser in
# particular treats them as a protocol violation and drops the player mid-game.
#
# The symptom is a client kicked with "Invalid packet received!" and, on the backend,
# "Client tried to send unused packet SubChunkRequestPacket!" shortly after a switch onto it.
#   backend.java.dropSubChunkRequests=true


# ==============================================================================================
#  JOINING AND FAILOVER — where a player lands, and where they go when a backend dies
# ==============================================================================================

# The backends to try, in order, when a player first connects. Without this a player whose
# backend is already down is simply kicked: mid-session failover only rescues someone who is
# already in a world. Defaults to failover.fallbacks when unset, which is why it is commented out
# here — every name listed must exist in 'backends' above.
#   join.try=default,lobby

# How many times to try each candidate before moving on. A backend that is down fails fast; one
# that is restarting may refuse a connection a second before it would have accepted it.
join.attemptsPerBackend=2

# Move a player to another backend when the one they are on dies, instead of kicking them off the
# proxy entirely.
failover.enabled=true

# Ordered list of where to send them. The first backend that accepts them wins. Defaults to
# hubBackend when unset.
failover.fallbacks=default

# Per-backend override of the list above, applied to players who were on that backend.
#   backend.survival.fallback=hub,lobby
# An empty value means "never fail over from here, disconnect instead":
#   backend.arena.fallback=

# --- Restarts and bans arrive as the same packet -----------------------------------------------
# A backend shutting down kicks everyone before the socket closes, and those players should be
# moved to a fallback. A backend banning somebody also kicks them, and moving *that* player
# overrides the ban - and loops, because the fallback transfers them straight back to the backend
# that just refused them.
#
# The wire tells the two apart, so 'auto' does not have to guess: a host-level disconnect sends a
# bare reason (HOST_DISCONNECTED, SERVER_SHUTDOWN) with the message flag skipped, while a ban or a
# moderator kick carries text written for that one player.
#
#   auto        fail over when the backend skipped the message, pass the kick through when it
#               sent one - restarts are seamless and bans hold
#   failover    always fail over; a ban can be escaped
#   disconnect  never fail over; a restart drops its players instead of moving them
failover.onBackendKick=auto

# --- Protocol faults are not backend outages -------------------------------------------------
# Everything above is for a backend that has gone away. A protocol fault is different: the backend
# is up, but it rejected a packet the proxy sent and tore the session down over it. Failing that
# player over does not fix anything (the bug travels with them), usually bounces them straight back
# to the same backend, and hides a codec bug behind a line that looks like flaky hosting.
#
# So a protocol fault disconnects the player instead. Set this to 'failover' to treat it as an
# ordinary backend loss and walk the fallback chain above.
protocolFault.action=disconnect

# What the disconnected player sees.
protocolFault.message=Disconnected: the server sent something this proxy could not relay. This has been logged - please report it.

# A file containing only protocol faults, so "has anything gone wrong today" is answered by its
# size rather than by reading the relay log. One self-contained line per fault: timestamp, player,
# backend, the packet id the backend could not read, and the schema member it named. Set empty to
# keep the disconnect rule but drop the dedicated file; faults are reported on stderr either way.
protocolFault.logFile=logs/protocol-errors.log


# ==============================================================================================
#  SWITCHING — how hard /server and /hub try
# ==============================================================================================

# The usual reason a switch fails is that the target is restarting, so a single attempt gives up
# on a backend that would have been back seconds later. Retries are silent: the player hears only
# the result. Set the window to 0 to try exactly once.
switch.retryWindowMillis=30000
switch.retryDelayMillis=3000

# Per-attempt wait for the target's StartGame.
switch.timeoutMillis=20000

# How long to wait for the target to answer at all. Deliberately below RakNet's own 10s default,
# so a backend that is simply down fails fast enough to still be retried inside the window above.
switch.connectTimeoutMillis=5000


# ==============================================================================================
#  FORCED HOSTS — route a player by the address they connected with
# ==============================================================================================

# One line per hostname. The port is ignored, so play.example.com also covers
# play.example.com:19132.
#   forcedHost.play.example.com=survival
#   forcedHost.creative.example.com=creative
#
# NOT a security boundary. The hostname comes from the client's ServerAddress claim, which is
# signed by the client's own key rather than Mojang's, so a modified client can claim any
# hostname it likes. Use it to pick a default door, not to decide who may walk through one —
# that is what permissions.* below is for, and a backend that must stay staff-only has to
# enforce that itself.


# ==============================================================================================
#  PERMISSIONS — who may run the administrative proxy commands
# ==============================================================================================

# Comma-separated XUIDs and/or gamertags, matched case-insensitively.
# Prefer XUIDs: both come from the Mojang-signed login chain and neither can be forged, but a
# gamertag can be changed by its owner and a released one can be claimed by someone else,
# whereas an XUID is permanent.
# Leave this empty and the admin commands are unavailable to everyone, including you.
permissions.admins=

# Commands only administrators may use. Anything not listed here is open to every player.
# 'perm' is always administrator-only whether or not it appears here — it grants permissions, so
# opening it would hand the proxy to the first player who tried it.
permissions.adminCommands=alert,glist,perm,send

# Backends only administrators may reach with /server. Others cannot list them, cannot switch to
# them, and do not receive them in their command tree at all — so there is no way to discover one
# exists. An administrator can still put someone there with /send.
#   backend.staff.adminOnly=true
#
# Permissions can also be granted at runtime with /perm, from the console or in game, and are
# stored in permissions.properties beside this file. Nodes are 'admin', 'command.<name>' and
# 'server.<name>'. What is listed here always applies on top and cannot be revoked with /perm,
# which is the way back in if a runtime grant goes wrong.


# ==============================================================================================
#  COMMANDS — which of the proxy's names a backend is allowed to keep
# ==============================================================================================

# The proxy answers /hub, /lobby, /server, /glist, /send, /alert and /perm before the backend ever
# sees them. That is usually what you want — but a hub plugin's /hub is often an in-world teleport
# to spawn and its /server an item-and-icon selector form, and neither is something the proxy can
# do. Passing a name through means: while the player is on that backend the proxy forwards the
# command untouched, and leaves its own entry out of the command tree there, so the backend's
# registration is the only one the client sees. Everywhere else the proxy keeps the name.
#
# This is per backend on purpose. The same /server can open the hub's selector on the hub and run
# the proxy's backend switch on a minigame server that has no such plugin:
#   backend.hub.passthroughCommands=hub,server
#   backend.skygen.passthroughCommands=
#
# A backend with no line of its own uses the list below. A backend with an explicitly empty line
# passes nothing through, which is how you exempt one backend from a global default -- an explicit
# value wins outright rather than adding to it, the same rule as backend.<name>.protocol and
# backend.<name>.fallback.
commands.passthrough=

# The prefix that reaches the proxy's implementation whatever a backend does with the bare name:
# /proxy:hub, /proxy:server, /proxy:perm. These are never forwarded and never injected into the
# command tree, so they appear in no autocomplete and no /help -- a player has to know the name to
# type it. That is what makes them the way back in: hand every name on the network to the backends
# and the proxy is still reachable.
#
# Hidden is not privileged. The qualified form is authorised exactly as the bare one is, so
# /proxy:alert is still refused to a player who may not run /alert. The prefix decides who handles
# a command, never who may run it.
#
# Change it if a client refuses to send a name containing a colon -- 'px_' and 'proxy_' work the
# same way. Set it empty to switch the qualified form off entirely, which also removes the way back
# in described above.
commands.qualifier=proxy:


# ==============================================================================================
#  SECURITY — abuse limits on a public address
# ==============================================================================================

# Keep RakNet's per-address packet rate limiter installed. Turning it off exposes the unconnected
# ping path, a classic UDP amplification target, on a public address.
security.rateLimit.enabled=true

# Datagrams per address per 10ms tick before that address is blocked for ten seconds.
#
# RakNet's own default is 120, which is generous for a client that is only playing and too small for
# one that is joining: a Bedrock login arrives as a run of MTU-sized fragments carrying the chain and
# skin, and a resource-pack download is answered by a stream of acknowledgements. Over loopback or a
# LAN both land inside a single tick. A player whose address is blocked mid-handshake ends as
# disconnect.timeout, retries, trips it again, and never gets in - so 120 is not the default here.
#
# Raise it further before turning the limiter off; the proxy names the address and this setting in
# the log whenever a block happens.
# 0 does NOT mean unlimited — it uninstalls the limiter, because a limit of zero is exceeded by
# the first datagram anyone sends.
security.rateLimit.packetLimit=500

# Datagrams per tick across all addresses combined.
security.rateLimit.globalPacketLimit=100000

# Make the RakNet handshake echo a server-chosen cookie, so a client has to be able to receive at
# the address it claims. Every Bedrock client since 1.20.60 supports it; BDS enables it by
# default.
security.sendConnectionCookie=true

# Concurrent sessions from one IP. Keep this above 1 — a home NAT, a school or an office is one
# address with several players behind it.
security.maxConnectionsPerAddress=5

# New sessions one IP may open within the window below. Each one costs a backend dial-out.
security.maxConnectionAttempts=8
security.connectionAttemptWindowMillis=10000

# Refuse a login whose Mojang-signed chain carries no XUID. Without this every such player
# collapses onto the same identity downstream and the duplicate-login check cannot tell them
# apart.
security.requireXuid=true

# Minimum gap between one player's proxy commands, so /server cannot be macro'd into a connection
# flood against a backend. Administrators are exempt. 0 disables it.
security.commandCooldownMillis=1000


# ==============================================================================================
#  BACKEND VERIFICATION — stop players connecting to a backend directly
# ==============================================================================================

# The proxy forges offline logins to backends, so a backend that is reachable on the network
# would otherwise accept anyone who dials it straight. The endstone-backend-verifier plugin asks
# the proxy to confirm each join over this endpoint and rejects the ones it cannot.
#
# The plugin .whl must be installed in plugins/ on EVERY backend, and its config must carry the
# same sharedSecret as below. Version skew between backends is a real, already-observed failure:
# delete the old .whl when uploading a new one.
backendVerification.enabled=true

# Where the proxy listens for verification requests. Keep it on a private interface — 127.0.0.1
# if the backends are on this host, otherwise an address only they can reach.
backendVerification.host=127.0.0.1
backendVerification.port=19135

# Shared HMAC secret between the proxy and every verifier plugin. CHANGE THIS. A backend with the
# wrong secret rejects every join.
backendVerification.sharedSecret=change-this-shared-secret

# How long a pending join stays valid after the proxy announces it, and how much clock skew to
# tolerate on a signed request. Raise the skew if proxy and backends run on separate hosts whose
# clocks are not tightly synchronised.
#
# The pending join is registered when the proxy starts the backend handshake, but the verifier only
# calls back once the backend reaches its login event - and the client's resource pack download sits
# between the two, with the backend connection held open across it. So this has to cover the slowest
# pack download you expect, not the handshake. It was 15 seconds, which players downloading a few
# megabytes of packs beat routinely; they were turned away with "Proxy verification failed." and read
# it as a random kick. All three verifier builds (stock, modified, geyser) depend on this one value.
backendVerification.pendingJoinTtlMillis=600000
backendVerification.requestSkewMillis=30000


# ==============================================================================================
#  SERVER LIST — what players see before they connect
# ==============================================================================================

motd=Endstone Proxy

# Free-text second line. The version shown next to it comes from the newest client protocol the
# proxy supports, not from here.
subMotd=Endstone Network

# Shown in the server list only. The real game mode comes from the backend.
gameType=Survival

# Advertised player cap. The proxy does not enforce it.
maxPlayers=20


# ==============================================================================================
#  RESOURCE PACKS
# ==============================================================================================

# Directory the proxy serves resource packs from, relative to this file. Empty (the default)
# serves none and passes the backend's own packs through.
#   resourcePacks.dir=resource-packs
#
# Each pack in that directory may be either a .mcpack/.zip file or an unpacked folder holding
# manifest.json (a folder wrapping a single such folder works too). Folders are zipped in memory
# at startup, so editing one means restarting the proxy for clients to see the change.
resourcePacks.dir=

# Keep a copy of the resource packs the backends use, so the proxy can serve them itself.
#
# A client downloads packs during its login handshake and never again, so a backend reached by
# switching cannot ask for its packs - the proxy answers that handshake on the player's behalf and
# the packs are simply missing for that player. With this on, the proxy learns each backend's packs
# (from the bytes passing through when a client downloads them, and by downloading them itself the
# first time anyone switches to that backend) into cache/packs, and serves them to everyone who logs
# in afterwards. It removes the need to copy each backend's packs into the directory above by hand.
#
# The first player to switch to an unlearned backend waits for that download once. Where two backends
# use the same pack, the newest version wins. Encrypted packs cannot be cached - the proxy has no key
# for them - and are named in the log so they can be added to resourcePacks.dir by hand.
resourcePacks.cacheBackendPacks=true

# Give every joining client the combined item and entity registries of all backends, and translate
# each backend's own network ids to match, so custom items and entities keep their textures across a
# seamless backend switch.
#
# Bedrock reads both registries once, at level init, and a switch does not re-run level init: without
# this, a backend's custom items draw arbitrary vanilla textures and its custom entities are
# invisible from the moment the player arrives from somewhere else. Serving the resource packs is
# necessary but not sufficient - the packs supply textures for identifiers the client never learned.
#
# The proxy learns each backend's registry the first time a player visits it and remembers it in
# cache/backend-palettes.nbt, so later logins already account for backends nobody has visited this
# run. After a backend's addons change, the first player to go there sees the old registry until they
# rejoin; that is logged, not silent.
crossBackendPalette=true


# ==============================================================================================
#  NETWORK
# ==============================================================================================

# Detailed packet logging is disabled by default. For debugging only, start Java with
# -Dproxy.logPackets=true to log every packet for the whole run. Alternatively,
# -Dproxy.traceMillis=45000 enables a 45-second trace after key events. Do not leave either enabled
# in production: Bedrock sends thousands of packets per minute.

# Batch compression algorithm for client traffic: zlib or snappy. Must be one the client
# supports; zlib is universal.
compression=zlib

# Uncompressed batch size, in bytes, above which a batch is compressed. 0 compresses everything.
compressionThreshold=0
