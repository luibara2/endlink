[versions]
netty = "4.1.130.Final"
junit = "5.14.1"
libdatachannel = "0.24.6.0-20261029.091642-10"
jose4j = "0.9.6"
gson = "2.13.2"
nmcp = "1.4.0"

[libraries]
expiringmap = { group = "net.jodah", name = "expiringmap", version = "0.5.10" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
netty-common = { group = "io.netty", name = "netty-common", version.ref = "netty" }
netty-buffer = { group = "io.netty", name = "netty-buffer", version.ref = "netty" }
netty-codec = { group = "io.netty", name = "netty-codec", version.ref = "netty" }
netty-codec-http = { group = "io.netty", name = "netty-codec-http", version.ref = "netty" }
netty-codec-haproxy = { group = "io.netty", name = "netty-codec-haproxy", version.ref = "netty" }
netty-transport = { group = "io.netty", name = "netty-transport", version.ref = "netty" }
netty-transport-native-unix-common = { group = "io.netty", name = "netty-transport-native-unix-common", version.ref = "netty" }
libdatachannel-java = { group = "dev.opencollab", name = "libdatachannel-java", version.ref = "libdatachannel" }
libdatachannel-java-arch-detect = { group = "dev.opencollab", name = "libdatachannel-java-arch-detect", version.ref = "libdatachannel" }
jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version = "1.85" }
jspecify = { group = "org.jspecify", name = "jspecify", version = "1.0.0" }

# Test dependencies
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }


[bundles]
netty = [ "netty-common", "netty-buffer", "netty-codec", "netty-transport", "netty-transport-native-unix-common" ]
junit = [ "junit-jupiter-engine", "junit-jupiter-api", "junit-jupiter-params" ]


[plugins]
nmcp = { id = "com.gradleup.nmcp", version.ref = "nmcp" }
nmcp-aggregation = { id = "com.gradleup.nmcp.aggregation", version.ref = "nmcp" }
